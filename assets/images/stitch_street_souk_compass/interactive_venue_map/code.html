<script>
        // Simple pan/zoom logic for the map
        const container = document.getElementById('map-container');
        const imgLayer = document.getElementById('map-image-layer');
        const markersLayer = document.getElementById('markers-layer');
        
        let isDragging = false;
        let startX, startY;
        let currentX = 0, currentY = 0;
        let scale = 1;

        // Mouse events
        container.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX - currentX;
            startY = e.clientY - currentY;
            container.style.cursor = 'grabbing';
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
            container.style.cursor = 'default';
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            e.preventDefault();
            currentX = e.clientX - startX;
            currentY = e.clientY - startY;
            updateTransform();
        });

        // Touch events for mobile panning
        container.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                startX = e.touches[0].clientX - currentX;
                startY = e.touches[0].clientY - currentY;
            }
        });

        window.addEventListener('touchend', () => {
            isDragging = false;
        });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging || e.touches.length !== 1) return;
            e.preventDefault();
            currentX = e.touches[0].clientX - startX;
            currentY = e.touches[0].clientY - startY;
            updateTransform();
        });

        // Simple zoom with wheel
        container.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomSensitivity = 0.001;
            scale -= e.deltaY * zoomSensitivity;
            // Limit scale
            scale = Math.min(Math.max(0.5, scale), 3);
            updateTransform();
        });

        function updateTransform() {
            const transformString = `translate(${currentX}px, ${currentY}px) scale(${scale})`;
            imgLayer.style.transform = transformString;
            markersLayer.style.transform = transformString;
        }
    </script>
