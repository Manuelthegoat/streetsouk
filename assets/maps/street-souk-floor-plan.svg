<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
<title id="title">Street Souk 2026 — Interactive Event Floor Plan</title>
<desc id="desc">Street Souk event grounds with stages, vendor booths, food court, amenities, entrances, exits, medical and accessibility facilities.</desc>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#dce3e8" stroke-width="1"/></pattern>
  <pattern id="grass" width="18" height="18" patternUnits="userSpaceOnUse"><rect width="18" height="18" fill="#e8f0df"/><circle cx="4" cy="5" r="1" fill="#d0dfc5"/><circle cx="14" cy="13" r="1" fill="#d0dfc5"/></pattern>
  <pattern id="concrete" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#edf0f2"/><path d="M0 14L14 0" stroke="#e1e5e8" stroke-width=".7"/></pattern>
  <pattern id="water" width="20" height="12" patternUnits="userSpaceOnUse"><rect width="20" height="12" fill="#dceef7"/><path d="M0 6Q5 2 10 6T20 6" fill="none" stroke="#b4d8e9" stroke-width="1"/></pattern>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#23313b}
    .zone{stroke:#53616b;stroke-width:2}
    .label{font-size:16px;font-weight:700;letter-spacing:.5px}
    .small{font-size:11px;font-weight:600}
    .tiny{font-size:9px}
    .micro{font-size:8px}
    .muted{fill:#64737d}
    .booth{fill:#fff;stroke:#74828b;stroke-width:1.5}
    .boothText{font-size:10px;font-weight:700;text-anchor:middle}
    .amenity{fill:#fff;stroke:#53616b;stroke-width:1.5}
    .road{fill:none;stroke:#fff;stroke-width:34;stroke-linecap:round;stroke-linejoin:round}
    .roadEdge{fill:none;stroke:#c7d0d6;stroke-width:1.5;stroke-dasharray:8 7}
    .route{fill:none;stroke:#2674c7;stroke-width:5;stroke-dasharray:10 8;stroke-linecap:round}
    .pin{stroke:#fff;stroke-width:2}
  </style>
  <g id="tree"><circle r="12" fill="#9fbd8d" stroke="#6d9367" stroke-width="2"/><circle cx="-4" cy="-3" r="4" fill="#b8cfa9"/></g>
  <g id="toilet"><rect x="-13" y="-12" width="26" height="24" rx="4" fill="#fff" stroke="#3d657c" stroke-width="1.5"/><text y="4" text-anchor="middle" font-size="13" font-weight="700" fill="#3d657c">WC</text></g>
  <g id="waterpoint"><circle r="12" fill="#d9f0fb" stroke="#2582ad" stroke-width="2"/><path d="M0-7C-7 1-6 7 0 8C6 7 7 1 0-7Z" fill="#2582ad"/></g>
  <g id="exit"><path d="M-15-12H8V-19L20 0 8 19V12H-15Z" fill="#239b69" stroke="#fff" stroke-width="2"/></g>
</defs>

<!-- Header -->
<rect width="1600" height="1120" fill="#f7f9fa"/>
<text x="48" y="48" font-size="28" font-weight="800" letter-spacing="1.4">STREET SOUK 2026 / EVENT FLOOR PLAN</text>
<text x="50" y="72" font-size="12" class="muted">STREET SOUK VENUE MAP • WAYFINDING PREVIEW</text>
<rect x="1290" y="28" width="260" height="44" rx="8" fill="#1d2c36"/>
<text x="1420" y="46" fill="#fff" font-size="11" text-anchor="middle" font-weight="700">GROUNDS OPEN</text>
<text x="1420" y="61" fill="#a9d8c2" font-size="10" text-anchor="middle">12:00 — 23:00</text>

<!-- Map boundary and base -->
<rect x="40" y="100" width="1520" height="960" rx="24" fill="url(#grass)" stroke="#35434c" stroke-width="4"/>
<rect x="56" y="116" width="1488" height="928" rx="18" fill="url(#grid)" opacity=".45"/>

